{% extends 'core/base.html' %}
{% block title %}New Card{% endblock  %}
{% block content %}
    <h2 class="text-3xl text-center font-bold italic">New Card</h2>
    <form action="." method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.as_p }}
        </div>
        
        {% if form.errors or form.non_fied_errors %}
        <div class="mb-3 p-6 bg-red-100 rounded-lg">
            {% for field in form  %}
            {{ field.errors }}
            {% endfor %}
            
            {{ form.non_field_errors }}
            
        </div>
        {% endif %}
        <button class="p-2 text-lg bg-teal-600 hover:bg-teal-800 rounded-md text-white mt-8">Add Card</button>
    </form>

{% endblock  %}
