{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}{% endblock %} | TCG Trader</title>
        {% tailwind_css %}
    </head>

    <body class="flex-container bg-stone-100">
        <nav class="p-6 flex justify-between items-center border-b border-gray-300">
            <a href="/" class="flex items-center allign-center">
                <img src="https://res.cloudinary.com/deumagcgr/image/upload/v1728680685/logo-tcg-round_xinmkw.png" alt="logo" class="w-20">
            </a>
        </nav>
        <div class="container mx-auto p-8">
            {% block content %}
            <!-- Este es el bloque donde los templates hijos inyectarán su contenido -->
            {% endblock %}
        </div>

    </body>
</html>
